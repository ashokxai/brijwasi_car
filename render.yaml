# Deploy backend on Render: https://render.com
# Dashboard alternative: New Web Service → connect this repo → Root Directory = backend
services:
  - type: web
    name: brijwasi-car-bazaar-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CONTACT_PHONE
        value: '+917060221729'
      - key: CONTACT_WHATSAPP
        value: '917060221729'
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: '5'
