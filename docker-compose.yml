services:
  mongo:
    image: mongo:7
    container_name: brijwasi-car-bazaar-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: brijwasi-car-bazaar-api
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      MONGODB_URI: mongodb://mongo:27017/brijwasi_car_bazaar
      JWT_SECRET: change_this_to_a_long_random_secret
      CLIENT_URL: http://localhost:5173
      CONTACT_PHONE: "+917060221729"
      CONTACT_WHATSAPP: "917060221729"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: http://localhost:5050/api
    container_name: brijwasi-car-bazaar-admin
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  backend_uploads:
